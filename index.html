<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#09090b">
  <title>Notový Trenažér</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/score.css">
  <link rel="stylesheet" href="css/lab.css">
  <link rel="stylesheet" href="css/metronome.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

  <!-- HORNÍ LIŠTA -->
  <header>
    <div class="brand">
      <img src="icon.svg" alt="Logo" class="brand-icon">
      <div class="app-title">Notový Trenažér</div>
      <div class="header-song-title" id="headerSongTitle" style="display:none;"></div>
    </div>
    
    <div class="nav-tabs">
      <button class="tab-btn tab-lib active" id="tabLibrary" onclick="switchMode('library')">Knihovna</button>
      <button class="tab-btn tab-edit" id="tabEdit" onclick="switchMode('edit')">Hraní</button>
      <button class="tab-btn tab-lab" id="tabLab" onclick="switchMode('lab')">Laboratoř <span class="badge-count" id="labBadgeCount" style="display:none;">0</span></button>
    </div>
  </header>

  <!-- 1. ZÁLOŽKA: KNIHOVNA -->
  <div class="view-panel" id="libraryView">
    <div class="toolbar" style="width:100%;">
      <label class="btn btn-primary">📷 Fotit noty <input type="file" id="cameraInput" class="file-input" accept="image/*" capture="environment"></label>
      <label class="btn">📁 PDF/Obrázek <input type="file" id="fileInput" class="file-input" accept="image/*,application/pdf"></label>
      <button class="btn" onclick="window.app.exportBackupJSON()">💾 Export</button>
    </div>

    <div class="library-container" style="margin-top:10px;">
      <div class="library-header">Uložené skladby (<span id="libCountSpan">0</span>)</div>
      <div class="library-list" id="libraryList"></div>
    </div>
  </div>

 <!-- 2. ZÁLOŽKA: HRANÍ & ZNAČKOVÁNÍ -->
  <div class="view-panel play-fullscreen-panel" id="editView" style="display:none; padding:0;">
    
    <!-- Ořezová lišta papíru (při aktivním ořezu) -->
    <div class="toolbar crop-toolbar" id="cropToolbar" style="display:none; width:100%;">
      <span style="font-weight:600; font-size:0.85rem; color:#93c5fd;">✂ Nastavte okraje not</span>
      <div style="margin-left:auto; display:flex; gap:6px;">
        <button class="btn btn-accent btn-sm" onclick="window.app.applyPaperCrop()">✔ Oříznout</button>
        <button class="btn btn-danger btn-sm" onclick="window.app.cancelPaperCrop()">✖ Zrušit</button>
      </div>
    </div>

    <!-- Plovoucí editační lišta rámečku taktu/klíče -->
    <div class="edit-subbar" id="editSubbar" style="display:none;">
      <div style="display:flex; justify-content:space-between; width:100%; flex-wrap:wrap; gap:6px;">
        <div style="display:flex; gap:6px; align-items:center;">
          <button id="addMeasureBtn" class="btn btn-accent btn-sm" onclick="window.app.saveCurrentMeasure()">✔ Uložit takt</button>
          <button id="setKeySigBtn" class="btn btn-gold btn-sm" onclick="window.app.saveCurrentAsKeySignature()">🎼 Uložit jako Klíč</button>
          <button id="toggleCategoryBtn" class="btn btn-sm" style="display:none;" onclick="window.app.toggleActiveCategory()">🔄 Změnit</button>
          <button id="deleteActiveBoxBtn" class="btn btn-danger btn-sm" style="display:none;" onclick="window.app.deleteActiveBox()">🗑 Smazat</button>
          <button class="btn btn-sm" onclick="window.app.resetActiveSelection()" title="Zrušit výběr (Esc)">✖ Zrušit</button>
        </div>
        <div style="display:flex; gap:6px;">
          <button class="size-btn" onclick="window.app.expandMeasure('left')">◀ +1</button>
          <button class="size-btn" onclick="window.app.expandMeasure('right')">+1 ▶</button>
        </div>
      </div>
    </div>

    <!-- Okno s notami -->
    <div class="canvas-box play-canvas-box" id="canvasBox">
      <div class="canvas-viewport" id="canvasViewport">
        <canvas id="scoreCanvas"></canvas>
      </div>

      <!-- PLOVOUCÍ TLAČÍTKO CELÁ OBRAZOVKA VPRAVO NAHOŘE (stejné místo v normálním i full režimu) -->
      <button class="floating-fs-btn" id="floatingFsBtn" onclick="window.app.toggleFullscreen()" title="Celá obrazovka">
        ⛶
      </button>

      <!-- Dotykové zóny pro otáčení stran -->
      <div class="page-turn-zone zone-left" id="zoneLeft" onclick="window.app.changePage(-1)"></div>
      <div class="page-turn-zone zone-right" id="zoneRight" onclick="window.app.changePage(1)"></div>
    </div>

    <!-- EDITAČNÍ KRESLICÍ LIŠTA (aktivní v režimu Edit) -->
    <div class="edit-draw-bar" id="editDrawBar" style="display:none;">
      <!-- Výběr režimu: Rámeček taktu vs Kreslení tužkou -->
      <!-- Výběr režimu: Rámeček taktu vs Kreslení tužkou vs Guma -->
      <div class="draw-tool-group">
        <button class="draw-tool-btn" id="toolBoxBtn" onclick="window.app.setEditTool('box')" title="Označit takt do laboratoře">📦 Takt</button>
        <button class="draw-tool-btn active" id="toolPenBtn" onclick="window.app.setEditTool('pen')" title="Kreslit do not">✏️ Tužka</button>
        <button class="draw-tool-btn" id="toolEraserBtn" onclick="window.app.setEditTool('eraser')" title="Guma na drobné opravy">🧹 Guma</button>
      </div>

      <div class="draw-separator"></div>

      <!-- Barvy -->
      <div class="draw-colors-group">
        <button class="color-btn color-red active" onclick="window.app.setPenColor('#ef4444')" title="Červená"></button>
        <button class="color-btn color-green" onclick="window.app.setPenColor('#10b981')" title="Zelená"></button>
        <button class="color-btn color-blue" onclick="window.app.setPenColor('#3b82f6')" title="Modrá"></button>
      </div>

      <div class="draw-separator"></div>

      <!-- Tloušťky: 1, 2, 3 -->
      <div class="draw-widths-group">
        <button class="width-btn active" id="widthBtn1" onclick="window.app.setPenWidth(2, 1)" title="Tenká (prstoklady)">
          <span class="dot-indicator dot-1"></span>
        </button>
        <button class="width-btn" id="widthBtn2" onclick="window.app.setPenWidth(4, 2)" title="Střední (smyky)">
          <span class="dot-indicator dot-2"></span>
        </button>
        <button class="width-btn" id="widthBtn3" onclick="window.app.setPenWidth(7, 3)" title="Tlustá (crescenda)">
          <span class="dot-indicator dot-3"></span>
        </button>
      </div>

      <div class="draw-separator"></div>

      <!-- Skrytí / zobrazení kreseb a Krok zpět -->
      <div class="draw-action-group">
        <button class="draw-tool-btn" id="toggleDrawingsBtn" onclick="window.app.toggleDrawingsVisibility()" title="Zobrazit/Skrýt kresby">👁️</button>
        <button class="draw-tool-btn" onclick="window.app.undoLastDrawing()" title="Zpět poslední tah">↩</button>
      </div>
    </div>

    <!-- PŘILEPENÁ SPODNÍ LIŠTA V HRANÍ (ÚSPORNÁ, NEPŘEPLNĚNÁ) -->
    <div class="docked-play-bar" id="dockedPlayBar">
      <button class="btn btn-accent btn-sm fixed-mode-btn" id="toggleInteractionBtn" onclick="window.app.toggleInteractionMode()">
        Hraní
      </button>

      <div class="page-switcher compact-page-switcher" id="pageSwitcher">
        <button class="page-btn" id="prevPageBtn" onclick="window.app.changePage(-1)">◀</button>
        <span class="page-indicator" id="pageIndicator">1/1</span>
        <button class="page-btn" id="nextPageBtn" onclick="window.app.changePage(1)">▶</button>
      </div>

      <!-- Kruhový metronom s tempem a počtem dob -->
      <div class="play-metro-group">
        <button class="metro-circle-btn circle-idle play-metro-circle" id="playMetroCircleBtn" onclick="window.app.toggleIncrementalMetronome()" title="Start / Stop metronom">
          <span class="circle-icon" id="playMetroCircleIcon">▶</span>
        </button>
        <div class="play-metro-tempo-ctrl">
          <button class="tempo-step-btn" onclick="window.app.metronome.changeBpm(-2)">−</button>
          <span class="play-metro-bpm-val" id="playMetroBpmText" onclick="window.app.promptSetBpm()">60</span>
          <button class="tempo-step-btn" onclick="window.app.metronome.changeBpm(2)">+</button>
        </div>
        <select class="play-metro-beats-select" id="playMetroBeatsSelect" onchange="window.app.metronome.setBeats(this.value)">
          <option value="2">2/4</option>
          <option value="3">3/4</option>
          <option value="4" selected>4/4</option>
          <option value="5">5/4</option>
          <option value="6">6/8</option>
          <option value="1">1/4</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 3. ZÁLOŽKA: LABORATOŘ -->
  <div class="view-panel practice-panel" id="labView" style="display:none; padding:8px 6px;">
    
    <div class="lab-queue-wrap" id="labQueueWrap">
      <div class="lab-queue-pills" id="labQueuePills"></div>
    </div>

    <!-- Hlavní cvičební plocha (v landscape se klíč řadí vedle not) -->
    <div class="lab-main-display" id="labMainDisplay">
      <!-- Čistý výřez klíče a předznamenání (bez textu) -->
      <div class="lab-clef-box" id="labClefWrap" style="display:none;">
        <canvas id="labClefCanvas"></canvas>
      </div>

      <!-- Hranatá lupa – kliknutím vlevo/vpravo se přepíná takt -->
      <div class="rect-loupe-container">
        <div class="rect-loupe-lens" id="rectLoupeLens" title="Klikněte vlevo pro předchozí takt, vpravo pro další takt">
          <canvas id="labCanvas"></canvas>
          <div class="lab-tap-zone lab-tap-left" onclick="window.app.prevLabMeasure()"></div>
          <div class="lab-tap-zone lab-tap-right" onclick="window.app.nextLabMeasure()"></div>
        </div>
      </div>
    </div>

    <!-- Pruh s tlačítkem Zvládnuto umístěný POD procvičovaným taktem -->
    <div class="lab-action-bar">
      <span class="lab-measure-indicator" id="labMeasureIndicator">Takt #1</span>
      <button class="btn btn-accent btn-sm" id="labResolveBtn" onclick="window.app.resolveCurrentLabMeasure()">
        ✔ Zvládnuto
      </button>
    </div>
  </div>

  <!-- METRONOM (VYSOUVACÍ NEBO DOKOVANÝ) -->
  <div class="docked-metronome" id="dockedMetronome" style="display:none;">
    <div class="metro-header-row">
      <button class="metro-circle-btn circle-idle" id="metroCircleBtn" onclick="window.app.toggleIncrementalMetronome()">
        <span class="circle-icon" id="metroCircleIcon">▶</span>
      </button>
      
      <div class="metro-tempo-display">
        <span class="tempo-current" id="metroCurrentBpmText">60</span>
        <span class="tempo-unit">BPM</span>
        <span class="tempo-target" id="metroTargetBpmText">➔ Cíl: 100</span>
      </div>

      <div class="metro-beat-lights" id="metroBeatLights">
        <div class="beat-light"></div>
        <div class="beat-light"></div>
        <div class="beat-light"></div>
        <div class="beat-light"></div>
      </div>
    </div>

    <div class="metro-controls-row">
      <div class="metro-input-group">
        <span class="metro-lbl">Start</span>
        <input type="number" id="metroStartBpm" value="60" min="30" max="260" class="metro-input">
      </div>
      <div class="metro-input-group">
        <span class="metro-lbl">Cíl</span>
        <input type="number" id="metroTargetBpm" value="100" min="30" max="260" class="metro-input">
      </div>
      <div class="metro-input-group">
        <span class="metro-lbl">+Krok</span>
        <input type="number" id="metroStepBpm" value="2" min="1" max="20" class="metro-input">
      </div>
      <div class="metro-input-group">
        <span class="metro-lbl">Taktů</span>
        <input type="number" id="metroBarsCount" value="1" min="1" max="64" class="metro-input">
      </div>
      <div class="metro-input-group">
        <span class="metro-lbl">Doby</span>
        <input type="number" id="metroBeatsPerBar" value="4" min="1" max="12" class="metro-input">
      </div>
      <button class="btn btn-danger metro-reset-btn" onclick="window.app.resetMetronomeTempo()">↺ Reset</button>
    </div>
  </div>

  <div id="touchLoupe" class="touch-loupe" style="display:none;">
    <canvas id="loupeCanvas" width="130" height="130"></canvas>
  </div>

  <script src="src/wakeLock.js"></script>
  <script src="src/db.js"></script>
  <script src="src/scanner.js"></script>
  <script src="src/boxEditor.js"></script>
  <script src="src/metronome.js"></script>
  <script src="src/trainer.js"></script>
  <script src="src/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(console.error);
    }
  </script>
</body>
</html>
