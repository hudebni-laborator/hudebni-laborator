<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Notový trenažér</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/lab.css">
  <link rel="stylesheet" href="css/metronome.css">
</head>
<body>
  <!-- HLAVNÍ NAVIGACE / HLAVIČKA -->
  <header class="app-header">
    <div class="header-left">
      <button class="nav-tab-btn" id="tabLibraryBtn" onclick="switchMode('library')">📚 Knihovna</button>
      <button class="nav-tab-btn active" id="tabEditBtn" onclick="switchMode('edit')">🎼 Hraní</button>
      <button class="nav-tab-btn" id="tabLabBtn" onclick="switchMode('lab')">
        🔬 Laboratoř <span class="badge" id="labBadgeCount" style="display:none;">0</span>
      </button>
    </div>

    <div class="header-center">
      <span class="header-title" id="headerSongTitle" style="display:none;">Skladba</span>
    </div>

    <div class="header-right">
      <button class="btn btn-sm btn-accent" id="toggleInteractionBtn" onclick="window.app.toggleInteractionMode()">Hraní</button>
      <button class="btn btn-sm btn-icon" id="floatingFsBtn" onclick="window.app.toggleFullscreen()" title="Celá obrazovka">⛶</button>
    </div>
  </header>

  <!-- POHLED: KNIHOVNA -->
  <main class="view-panel" id="libraryView" style="display:none;">
    <div class="library-header">
      <div class="library-title-row">
        <h2>Moje noty (<span id="libCountSpan">0</span>)</h2>
        <div class="lib-actions">
          <label class="btn btn-primary btn-sm">
            ➕ Nahrát soubor
            <input type="file" id="fileUploadInput" class="file-input" accept="application/pdf,image/*">
          </label>
        </div>
      </div>
      <div class="library-sort-row">
        <button class="btn-subtle active" id="sortRecentBtn" onclick="window.app.setLibrarySort('recent')">Nejnovější</button>
        <button class="btn-subtle" id="sortAlphaBtn" onclick="window.app.setLibrarySort('name')">Abecedně</button>
        <button class="btn-subtle" onclick="window.app.exportBackupJSON()">Zálohovat</button>
        <label class="btn-subtle">
          Obnovit
          <input type="file" id="importBackupInput" class="file-input" accept=".json" onchange="window.app.importBackupJSON(event)">
        </label>
      </div>
    </div>
    <div class="library-list" id="libraryList"></div>
  </main>

  <!-- POHLED: HRANÍ / EDITACE NOT -->
  <main class="view-panel" id="editView" style="display:flex;">
    <!-- Nástrojová lišta pro kreslení -->
    <div class="edit-draw-bar" id="editDrawBar" style="display:none;">
      <div class="draw-tool-group">
        <button class="draw-tool-btn active" id="toolBoxBtn" onclick="window.app.setEditTool('box')" title="Označit takt do laboratoře">📦 Takt</button>
        <button class="draw-tool-btn" id="toolPenBtn" onclick="window.app.setEditTool('pen')" title="Kreslit do not">✏️ Tužka</button>
        <button class="draw-tool-btn" id="toolEraserBtn" onclick="window.app.setEditTool('eraser')" title="Guma na drobné opravy">🧹 Guma</button>
      </div>

      <div class="draw-separator"></div>

      <div class="draw-colors-group">
        <button class="color-btn color-red active" onclick="window.app.setPenColor('#ef4444')" title="Červená"></button>
        <button class="color-btn color-green" onclick="window.app.setPenColor('#10b981')" title="Zelená"></button>
        <button class="color-btn color-blue" onclick="window.app.setPenColor('#3b82f6')" title="Modrá"></button>
      </div>

      <div class="draw-separator"></div>

      <div class="draw-action-group">
        <button class="draw-tool-btn" id="toggleDrawingsBtn" onclick="window.app.toggleDrawingsVisibility()" title="Zobrazit/Skrýt kresby">👁️</button>
        <button class="draw-tool-btn" onclick="window.app.undoLastDrawing()" title="Zpět poslední tah">↩</button>
        <label class="draw-tool-btn" id="addPageLabel" title="Vyfotit a přidat další stranu">
          📷 +Str
          <input type="file" id="addPageInput" class="file-input" accept="image/*" capture="environment">
        </label>
        <button class="draw-tool-btn" id="cropPaperBtn" onclick="window.app.startPaperCrop()" title="Oříznout okraje papíru">✂</button>
      </div>
    </div>

    <!-- Spodní podlišta pro potvrzení/úpravu označeného taktu -->
    <div class="edit-subbar" id="editSubbar" style="display:none;">
      <button class="btn btn-sm btn-primary" id="addMeasureBtn" onclick="window.app.saveCurrentMeasure()">✔ Uložit takt</button>
      <button class="btn btn-sm btn-accent" id="setKeySigBtn" onclick="window.app.saveCurrentAsKeySignature()" style="display:none;">🎼 Uložit jako Klíč</button>
      <button class="btn btn-sm btn-subtle" id="toggleCategoryBtn" onclick="window.app.toggleActiveCategory()" style="display:none;">🔄 Na Klíč</button>
      <button class="btn btn-sm btn-danger" id="deleteActiveBoxBtn" onclick="window.app.deleteActiveBox()" style="display:none;">🗑 Smazat</button>
      <button class="btn btn-sm btn-subtle" onclick="window.app.resetActiveSelection()">✕ Zrušit</button>
    </div>

    <!-- Ořezová lišta papíru -->
    <div class="crop-toolbar" id="cropToolbar" style="display:none;">
      <span>Oříznutí okrajů</span>
      <button class="btn btn-sm btn-primary" onclick="window.app.applyPaperCrop()">✔ Oříznout</button>
      <button class="btn btn-sm btn-subtle" onclick="window.app.cancelPaperCrop()">✕ Zrušit</button>
    </div>

    <!-- Notové plátno s dotykovým viewportem -->
    <div class="canvas-box" id="canvasBox">
      <div class="canvas-viewport" id="canvasViewport">
        <canvas id="scoreCanvas"></canvas>
      </div>

      <!-- Zóny pro listování dotykem při hraní -->
      <div class="page-turn-zone left" id="zoneLeft" onclick="window.app.changePage(-1)"></div>
      <div class="page-turn-zone right" id="zoneRight" onclick="window.app.changePage(1)"></div>
    </div>

    <!-- Plovoucí stránkovací lišta -->
    <div class="page-switcher-bar">
      <button class="btn btn-sm btn-icon" id="prevPageBtn" onclick="window.app.changePage(-1)">◀</button>
      <span class="page-indicator" id="pageIndicator">1/1</span>
      <button class="btn btn-sm btn-icon" id="nextPageBtn" onclick="window.app.changePage(1)">▶</button>
    </div>
  </main>

  <!-- POHLED: LABORATOŘ -->
  <main class="view-panel" id="labView" style="display:none;">
    <div class="lab-workspace">
      <!-- Horní řádek Laboratoře: Klíč + Kontext (Před / Za + Jemný posun) + Fronta -->
      <div class="lab-top-row" id="labTopRow">
        <div class="lab-clef-box" id="labClefWrap" style="display:none;">
          <canvas id="labClefCanvas"></canvas>
        </div>

        <div class="lab-context-controls">
          <button class="ctx-pill-btn" id="labCtxBeforeBtn" onclick="window.app.toggleLabContext('before')" title="Zobrazit dobu před taktem">⇥ Před</button>
          <button class="ctx-pill-btn" id="labCtxAfterBtn" onclick="window.app.toggleLabContext('after')" title="Zobrazit dobu za taktem">Za ⇤</button>

          <!-- Šipky pro jemné doladění posunu výřezu vodorovně i svisle -->
          <div class="ctx-nudge-group" id="labCtxNudgeGroup" style="display:none;">
            <button class="ctx-nudge-btn" onclick="window.app.nudgeLabContext('x', -8)" title="Posunout doleva">◀</button>
            <button class="ctx-nudge-btn" onclick="window.app.nudgeLabContext('x', 8)" title="Posunout doprava">▶</button>
            <button class="ctx-nudge-btn" onclick="window.app.nudgeLabContext('y', -3)" title="Zvýšit linky">▲</button>
            <button class="ctx-nudge-btn" onclick="window.app.nudgeLabContext('y', 3)" title="Snížit linky">▼</button>
          </div>
        </div>

        <div class="lab-queue-wrap" id="labQueueWrap">
          <div class="lab-queue-pills" id="labQueuePills"></div>
        </div>
      </div>

      <!-- Obdélníková lupa se cvičeným taktem -->
      <div class="rect-loupe-container">
        <div class="rect-loupe-lens" id="rectLoupeLens">
          <div class="lab-viewport" id="labViewport">
            <canvas id="labCanvas"></canvas>
          </div>
        </div>
      </div>

      <!-- Spodní ovládací lišta Laboratoře -->
      <div class="lab-controls-bar">
        <div class="lab-nav-group">
          <button class="btn btn-sm btn-subtle" onclick="window.app.prevLabMeasure()">◀ Předchozí</button>
          <span class="lab-measure-indicator" id="labMeasureIndicator">Takt #1</span>
          <button class="btn btn-sm btn-subtle" onclick="window.app.nextLabMeasure()">Další ▶</button>
        </div>

        <button class="btn btn-sm btn-success" onclick="window.app.resolveCurrentLabMeasure()">✔ Zvládnuto</button>

        <div class="lab-draw-group">
          <button class="draw-tool-btn" id="labToolPenBtn" onclick="window.app.setEditTool('pen')" title="Kreslit do taktu">✏️</button>
          <button class="draw-tool-btn" id="labToolEraserBtn" onclick="window.app.setEditTool('eraser')" title="Mazat">🧹</button>
          <button class="draw-tool-btn" id="labToggleDrawingsBtn" onclick="window.app.toggleDrawingsVisibility()" title="Skrýt kresby">👁️</button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="src/db.js"></script>
  <script src="src/metronome.js"></script>
  <script src="src/scanner.js"></script>
  <script src="src/trainer.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
