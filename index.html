<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1f1f1f">
  <title>Kytarový Trenažér</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

  <header>
    <div class="app-title">
      Kytarový Trenažér
      <span class="badge" id="appModeBadge">Příprava</span>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" id="tabEdit" onclick="switchMode('edit')">1. Značkování</button>
      <button class="tab-btn" id="tabPractice" onclick="switchMode('practice')">2. Cvičení</button>
    </div>
  </header>

  <!-- Lišta nástrojů pro značkování (pouze běžné pracovní akce) -->
  <div class="toolbar" id="editToolbar">
    <button class="btn" onclick="app.openLibraryModal()">📚 Knihovna (<span class="lib-count-span">0</span>)</button>

    <label class="btn btn-primary" title="Vyfotit noty fotoaparátem">
      📷 Vyfotit noty
      <input type="file" id="cameraInput" class="file-input" accept="image/*" capture="environment">
    </label>

    <label class="btn" title="Nahrát PDF nebo obrázek z úložiště">
      📁 Soubor
      <input type="file" id="fileInput" class="file-input" accept="image/*,application/pdf">
    </label>

    <label class="btn" id="addPageBtn" style="display:none;" title="Vyfotit a přidat další list k této skladbě">
      📷 + Další strana
      <input type="file" id="addPageInput" class="file-input" accept="image/*" capture="environment">
    </label>

    <div class="page-switcher" id="pageSwitcher" style="display:none;">
      <button class="page-btn" id="prevPageBtn" onclick="app.changePage(-1)">◀</button>
      <span class="page-indicator" id="pageIndicator">Strana 1/1</span>
      <button class="page-btn" id="nextPageBtn" onclick="app.changePage(1)">▶</button>
    </div>

    <button id="addMeasureBtn" class="btn btn-accent" style="display:none;" onclick="app.saveCurrentMeasure()">
      ✔ Uložit takt <span id="nextMeasureNum">1</span>
    </button>
    <button id="setKeySigBtn" class="btn btn-gold" style="display:none;" onclick="app.saveCurrentAsKeySignature()">
      🎼 Uložit jako Klíč/Předznamenání
    </button>
    <button id="deleteSelectedMeasureBtn" class="btn btn-danger" style="display:none;" onclick="app.deleteSelectedMeasure()">
      🗑 Smazat tento takt
    </button>
  </div>

  <!-- Lišta pro úpravu a rozšiřování rámečku -->
  <div class="edit-subbar" id="editSubbar" style="display:none;">
    <div class="subbar-group">
      <span class="subbar-label">Více taktů:</span>
      <button class="size-btn size-btn-highlight" onclick="app.expandMeasure('left')">◀ +1 Takt vlevo</button>
      <button class="size-btn size-btn-highlight" onclick="app.expandMeasure('right')">+1 Takt vpravo ▶</button>
    </div>
    <div class="subbar-group">
      <span class="subbar-label">Zúžit:</span>
      <button class="size-btn" onclick="app.shrinkMeasure('left')">Zleva -1</button>
      <button class="size-btn" onclick="app.shrinkMeasure('right')">Zprava -1</button>
    </div>
    <div class="subbar-group">
      <span class="subbar-label">Jemně (px):</span>
      <button class="size-btn" onclick="app.adjustActiveWidth(-10)">-10</button>
      <button class="size-btn" onclick="app.adjustActiveWidth(10)">+10</button>
      <button class="size-btn" onclick="app.adjustActiveEdge('left', -4)">◀ Vlevo</button>
      <button class="size-btn" onclick="app.adjustActiveEdge('right', 4)">Vpravo ▶</button>
    </div>
  </div>

  <main>
    <!-- 1. EDIT VIEW -->
    <div class="view-panel" id="editView">
      <div class="canvas-box">
        <canvas id="scoreCanvas"></canvas>
      </div>
      <div class="status-msg" id="statusHint">Vyfoťte noty z pultu nebo vyberte z knihovny a klepněte na takt.</div>

      <!-- Bezpečná zóna dole pod notami pro smazání všech taktů -->
      <div class="danger-zone">
        <button id="clearMeasuresBtn" class="btn btn-subtle-danger" style="display:none;" onclick="app.clearMeasures()">
          🗑 Smazat všechny označené takty (<span id="measureCountSpan">0</span>)
        </button>
      </div>
    </div>

    <!-- 2. PRACTICE VIEW -->
    <div class="view-panel" id="practiceView">
      <div class="toolbar" style="width:100%; border-radius:8px;">
        <button class="btn" onclick="app.openLibraryModal()">📚 Knihovna (<span class="lib-count-span">0</span>)</button>
        <div class="ctrl-group" style="margin-left:auto;">
          <label for="stackCountSelect">Zobrazit pod sebou:</label>
          <select id="stackCountSelect" onchange="app.updatePracticeStackCount()">
            <option value="1">1 takt</option>
            <option value="2">2 takty pod sebou</option>
            <option value="3">3 takty pod sebou</option>
            <option value="4">4 takty pod sebou</option>
            <option value="loop">Všechny ve smyčce</option>
          </select>
        </div>
      </div>

      <div class="practice-card">
        <div class="clef-banner" id="clefBanner">
          <span class="clef-label">Klíč & Předznamenání:</span>
          <div class="clef-preview-wrap" id="clefPreviewWrap">
            <canvas id="clefCanvas"></canvas>
          </div>
          <span class="clef-empty-hint" id="clefEmptyHint" style="display:none;">(Lze označit v záložce Značkování)</span>
        </div>

        <div class="practice-display" id="practiceDisplay" title="Klepnutím vlevo/vpravo přepnete takt">
          <canvas id="practiceCanvas"></canvas>
          <div class="tap-hint">◀ klepnutí vlevo / vpravo pro přepnutí taktu ▶</div>
        </div>
      </div>

      <div class="trainer-controls">
        <div class="measure-stepper">
          <button class="btn btn-nav" onclick="app.prevMeasure()">◀ Předchozí takt</button>
          <div class="measure-indicator" id="practiceMeasureTitle">Takt 1 / 1</div>
          <button class="btn btn-nav btn-primary" onclick="app.nextMeasure(true)">Další takt ▶</button>
        </div>

        <div class="trainer-row" style="justify-content: center;">
          <div class="ctrl-group">
            <label>Omezení smyčky od taktu:</label>
            <input type="number" id="loopFrom" value="1" min="1" style="width:65px;">
            <label>do:</label>
            <input type="number" id="loopTo" value="1" min="1" style="width:65px;">
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="touchLoupe" class="touch-loupe" style="display:none;">
    <canvas id="loupeCanvas" width="130" height="130"></canvas>
  </div>

  <div class="modal-overlay" id="libraryModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Knihovna skladeb (IndexedDB)</div>
        <button class="size-btn" onclick="app.closeLibraryModal()">✕</button>
      </div>
      <div class="modal-body" id="libraryList"></div>
    </div>
  </div>

  <script src="src/wakeLock.js"></script>
  <script src="src/db.js"></script>
  <script src="src/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(console.error);
    }
  </script>
</body>
</html>
