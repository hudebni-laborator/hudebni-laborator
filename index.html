<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1f1f1f">
  <title>Kytarový Trenažér</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

  <header>
    <div class="app-title">
      Kytarový Trenažér
      <span class="badge" id="appModeBadge">Příprava</span>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" id="tabEdit" onclick="switchMode('edit')">1. Značkování</button>
      <button class="tab-btn" id="tabPractice" onclick="switchMode('practice')">2. Cvičení</button>
    </div>
  </header>

  <div class="toolbar" id="editToolbar">
    <button class="btn" onclick="app.openLibraryModal()">📚 Knihovna (<span id="libCountSpan">0</span>)</button>
    <label class="btn">
      + Nové noty (PDF/Obrázek)
      <input type="file" id="fileInput" class="file-input" accept="image/*,application/pdf">
    </label>

    <!-- Přepínač stránek PDF (zobrazí se pouze pro vícestránková PDF) -->
    <div class="page-switcher" id="pageSwitcher" style="display:none;">
      <button class="page-btn" id="prevPageBtn" onclick="app.changePage(-1)">◀</button>
      <span class="page-indicator" id="pageIndicator">Strana 1/1</span>
      <button class="page-btn" id="nextPageBtn" onclick="app.changePage(1)">▶</button>
    </div>

    <!-- Tlačítka uložení / aktualizace rámečku -->
    <button id="addMeasureBtn" class="btn btn-accent" style="display:none;" onclick="app.saveCurrentMeasure()">
      ✔ Uložit takt <span id="nextMeasureNum">1</span>
    </button>
    <button id="deleteSelectedMeasureBtn" class="btn btn-danger" style="display:none;" onclick="app.deleteSelectedMeasure()">
      🗑 Smazat tento takt
    </button>
    <button id="clearMeasuresBtn" class="btn btn-danger" style="display:none;" onclick="app.clearMeasures()">
      Smazat vše (<span id="measureCountSpan">0</span>)
    </button>
  </div>

  <!-- Lišta pro úpravu a rozšiřování rámečku -->
  <div class="edit-subbar" id="editSubbar" style="display:none;">
    <div class="subbar-group">
      <span class="subbar-label">Více taktů:</span>
      <button class="size-btn size-btn-highlight" onclick="app.expandMeasure('left')">◀ +1 Takt vlevo</button>
      <button class="size-btn size-btn-highlight" onclick="app.expandMeasure('right')">+1 Takt vpravo ▶</button>
    </div>
    <div class="subbar-group">
      <span class="subbar-label">Zúžit:</span>
      <button class="size-btn" onclick="app.shrinkMeasure('left')">Zleva -1</button>
      <button class="size-btn" onclick="app.shrinkMeasure('right')">Zprava -1</button>
    </div>
    <div class="subbar-group">
      <span class="subbar-label">Jemně (px):</span>
      <button class="size-btn" onclick="app.adjustActiveWidth(-10)">-10</button>
      <button class="size-btn" onclick="app.adjustActiveWidth(10)">+10</button>
      <button class="size-btn" onclick="app.adjustActiveEdge('left', -4)">◀ Vlevo</button>
      <button class="size-btn" onclick="app.adjustActiveEdge('right', 4)">Vpravo ▶</button>
    </div>
  </div>

  <main>
    <!-- EDIT VIEW -->
    <div class="view-panel" id="editView">
      <div class="canvas-box">
        <canvas id="scoreCanvas"></canvas>
      </div>
      <div class="status-msg" id="statusHint">Nahrajte skladbu nebo vyberte z knihovny a klepněte na takt.</div>
    </div>

    <!-- PRACTICE VIEW -->
    <div class="view-panel" id="practiceView">
      <div class="practice-display" id="practiceDisplay" title="Klepnutím vlevo/vpravo přepnete takt">
        <canvas id="practiceCanvas"></canvas>
        <div class="tap-hint">◀ klepnutí vlevo / vpravo ▶</div>
      </div>

      <div class="trainer-controls">
        <div class="measure-stepper">
          <button class="btn btn-nav" onclick="app.prevMeasure()">◀ Předchozí</button>
          <div class="measure-indicator" id="practiceMeasureTitle">Takt 1 / 1</div>
          <button class="btn btn-nav" onclick="app.nextMeasure(true)">Další ▶</button>
        </div>

        <div class="trainer-row">
          <div class="ctrl-group">
            <label for="bpmInput">Tempo (BPM):</label>
            <input type="number" id="bpmInput" value="80" min="40" max="240" step="1" style="width:75px;">
          </div>
          <div class="ctrl-group">
            <label for="beatsPerMeasure">Doby v taktu:</label>
            <input type="number" id="beatsPerMeasure" value="4" min="1" max="12" style="width:65px;">
          </div>
          <div class="ctrl-group">
            <div class="beat-indicator" id="beatDot"></div>
            <button class="btn btn-primary" id="playBtn" onclick="app.togglePlay()">▶ Start Metronom</button>
          </div>
        </div>

        <div class="trainer-row">
          <div class="ctrl-group">
            <label>Smyčka od taktu:</label>
            <input type="number" id="loopFrom" value="1" min="1" style="width:60px;">
            <label>do:</label>
            <input type="number" id="loopTo" value="1" min="1" style="width:60px;">
          </div>
          <div class="ctrl-group">
            <label><input type="checkbox" id="autoAdvance" checked> Posunout po doběhnutí taktu</label>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- LUPA NAD PRSTEM PŘI EDITACI -->
  <div id="touchLoupe" class="touch-loupe" style="display:none;">
    <canvas id="loupeCanvas" width="130" height="130"></canvas>
  </div>

  <!-- MODÁLNÍ OKNO KNIHOVNY -->
  <div class="modal-overlay" id="libraryModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Knihovna skladeb (IndexedDB)</div>
        <button class="size-btn" onclick="app.closeLibraryModal()">✕</button>
      </div>
      <div class="modal-body" id="libraryList"></div>
    </div>
  </div>

  <script src="src/wakeLock.js"></script>
  <script src="src/db.js"></script>
  <script src="src/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(console.error);
    }
  </script>
</body>
</html>
